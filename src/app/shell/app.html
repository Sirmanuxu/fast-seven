@if (!ready()) {
  <main aria-live="polite">
    <p>{{ strings.loading }}</p>
  </main>
} @else if (!databaseAvailable()) {
  <main>
    <h1>{{ strings.databaseUnavailableTitle }}</h1>
  </main>
} @else {
  @if (backupQuotaWarning()) {
    <aside role="alert">{{ backupQuotaWarningMessage }}</aside>
  }
  <app-tournament-file-bar />
  <router-outlet />
}
<aside class="app-version" aria-label="Versión de la aplicación">v{{ appVersion }}</aside>
