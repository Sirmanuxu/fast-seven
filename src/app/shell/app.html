<div class="app-shell">
  @if (!ready()) {
    <main class="app-content" aria-live="polite">
      <p>{{ strings.loading }}</p>
    </main>
  } @else if (!databaseAvailable()) {
    <main class="app-content" role="alert">
      <h1>{{ strings.databaseUnavailableTitle }}</h1>
      <p>{{ strings.databaseUnavailable }}</p>
    </main>
  } @else {
    <div class="app-content">
      <router-outlet />
    </div>
  }

  <footer class="app-footer">Fast Seven · v0.11.2</footer>
</div>
