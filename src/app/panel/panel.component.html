<main>
  <h1>{{ strings.panelTitle }}</h1>

  <section>
    <p>{{ offlineStatus() }}</p>
    <p>{{ persistenceStatus() }}</p>
    @if (savedAt(); as time) {
      <p>{{ persistenceStrings.savedPrefix }} {{ time }}</p>
    }
  </section>

  <button type="button" (click)="saveTest()">{{ strings.saveTest }}</button>
  <button type="button" (click)="openProjector()">{{ strings.openProjector }}</button>
  <button type="button" (click)="openPlayers()">Jugadores</button>
  <button type="button" (click)="openTeams()">Equipos</button>
  <button type="button" (click)="openRules()">Reglas</button>

  @if (lastRecord(); as record) {
    <p>Último dato guardado: {{ record.message }}</p>
  }

</main>
