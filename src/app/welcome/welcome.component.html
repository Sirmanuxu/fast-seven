<main>
  <h1>{{ strings.welcomeTitle }}</h1>
  <p>{{ strings.welcomePrompt }}</p>

  <label>
    {{ strings.tournamentNameLabel }}
    <input
      type="text"
      [value]="tournamentName()"
      (input)="tournamentName.set($any($event.target).value)"
    />
  </label>

  <button type="button" (click)="createTournament()">{{ strings.createTournament }}</button>

  @if (persistenceNotice(); as notice) {
    <p role="status">{{ notice }}</p>
  }
</main>
